<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <title>Botanischer Garten Würzburg – Lehrpfade</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <section id="logo" class="logo-container">
        <img src="Bilder/BGLogo.png" class="logo-bild" alt="Logo" />
    </section>

    <div class="container startseite-container">
        <h2>Herzlich willkommen im Botanischen Garten der Universität Würzburg</h2>
        <p class="info-text">
            Nutzen sie die digitalen Führungen für ihren Rundgang durch den Garten.
        </p>

        <div id="lehrpfade" class="lehrpfade-grid">
            <!-- Lehrpfade werden hier dynamisch eingefügt -->
        </div>
    </div>

    <script>
        /**
     * LEHRPFAD-ÜBERSICHT LADEN
     * 
     * Liest die 'LehrpfadeConfig.xml' aus, sortiert die vorhanden Lehrpfade nach ihrer ID,
     * rendert für jeden Pfad eine interaktive Kachel (Card) im Grid-Container 
     * und kümmert sich um die "… weiterlesen"-Logik für lange Einführungstexte.
     */
        async function ladeLehrpfade() {
            try {
                // 1. XML-Konfigurationsdatei abrufen und parsen
                const response = await fetch("LehrpfadeConfig.xml");
                const xmlText = await response.text();

                const parser = new DOMParser();
                const xml = parser.parseFromString(xmlText, "application/xml");

                // Alle <Lehrpfad>-Knoten in ein Array umwandeln
                const lehrpfade = Array.from(xml.getElementsByTagName("Lehrpfad"));

                // 2. Lehrpfade aufsteigend nach PfadId sortieren
                lehrpfade.sort((a, b) => {
                    const idA = parseInt(a.getElementsByTagName("PfadId")[0].textContent, 10);
                    const idB = parseInt(b.getElementsByTagName("PfadId")[0].textContent, 10);
                    return idA - idB;
                });

                const container = document.getElementById("lehrpfade");

                // 3. Kacheln dynamisch für jeden Lehrpfad erstellen
                lehrpfade.forEach(pfad => {
                    const pfadId = pfad.getElementsByTagName("PfadId")[0].textContent;
                    const name = pfad.getElementsByTagName("UrlName")[0].textContent;
                    const icon = pfad.getElementsByTagName("IconName")[0].textContent;
                    const stationen = pfad.getElementsByTagName("StationsCount")[0].textContent;
                    const dauerNode = pfad.getElementsByTagName("Dauer")[0];
                    const dauer = dauerNode ? dauerNode.textContent : "";
                    const autor = pfad.getElementsByTagName("Autor")[0].textContent;
                    const sprachIconNode = pfad.getElementsByTagName("SprachIcon")[0];
                    const sprachIcon = sprachIconNode ? sprachIconNode.textContent : "";
                    const einfuehrungNode = pfad.getElementsByTagName("Einfuehrungstext")[0];
                    // Falls kein Einführungstext in der XML hinterlegt ist, bleibt das Feld leer
                    const einfuehrung = einfuehrungNode ? einfuehrungNode.innerHTML : "";
                    // HTML-Kachel erzeugen (wird als "card" benannt und managed)
                    const card = document.createElement("div");
                    card.className = "lehrpfad-card";
                    // Klick auf die gesamte Kachel/card leitet zur Karte des gewählten Lehrpfads weiter
                    card.addEventListener("click", () => {
                        window.location.href = `Startseite.html?id=${pfadId}`;
                    });

                    card.innerHTML = `
                    <div class="lehrpfad-header">
                        <div class="lehrpfad-title">${name}</div>

                        ${sprachIcon
                            ? `<img class="flaggen-icon"
                            src="${sprachIcon}"
                            alt="Sprache">`
                            : ""
                        }
                    </div>

                        <div class="lehrpfad-content">
                            <div class="lehrpfad-left">
                            <img src="${icon}" alt="${name}">
                            <div class="lehrpfad-stationen">
                                ${stationen}
                            </div>
                            <div class="lehrpfad-dauer">
                                ${dauer}
                            </div>
                        </div>

                        <div>
                            <div class="lehrpfad-autor">${autor}</div>

                                <div class="lehrpfad-text" data-fulltext="${encodeURIComponent(einfuehrung)}">
                                    ${einfuehrung}
                                <div class="read-more" hidden>
                                    <button type="button" class="read-more-btn">… weiterlesen</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;

                    container.appendChild(card);
                    // 4. "… weiterlesen"-Schaltfläche aktivieren, falls der Text die maximale Höhe überschreitet
                    const textEl = card.querySelector(".lehrpfad-text");
                    const moreWrap = card.querySelector(".read-more");
                    const moreBtn = card.querySelector(".read-more-btn");

                    /**
                    * Prüft, ob der Inhalt der Kachel abgeschnitten wird.
                    */
                    function needsClamp(el) {
                        // nur anzeigen, wenn wirklich abgeschnitten wird
                        return el.scrollHeight > el.clientHeight + 2;
                    }

                    // Messung erst nach Einfügen in den DOM ausführen
                    requestAnimationFrame(() => {
                        if (needsClamp(textEl)) {
                            moreWrap.hidden = false;
                        }
                    });

                    // Klick-Handler für den "weiterlesen"-Button
                    moreBtn.addEventListener("click", (e) => {
                        e.preventDefault();
                        e.stopPropagation(); // verhindert das Öffnen des Lehrpfads beim Klick!

                        textEl.classList.add("expanded");
                        moreWrap.hidden = true;
                    });

                });

            } catch (error) {
                console.error("Fehler beim Laden der Lehrpfade:", error);
            }
        }

        // Skript starten, sobald das DOM vollständig aufgebaut ist
        document.addEventListener("DOMContentLoaded", ladeLehrpfade);
    </script>

</body>

</html>
