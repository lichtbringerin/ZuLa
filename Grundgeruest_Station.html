  <!-- ==========================================
       JAVASCRIPT STEUERUNG (Stationsspezifisch)
       ========================================== -->
  <script>
    /**
     * 1. FORTSCHRITTS-HANDLING & NAVIGATION
     * SOLLTE BEI JEDER STATION DABEI SEIN DA SIE GRUNDLAGEN FÜR DIE NAVIGATION BILDEN!
     * Greift auf globale Variablen und Funktionen aus loadProject.js zu.
     */

    // Gespeicherten Fortschritt (Array der abgeschlossenen Stationen) laden
    window.stationsComplete = JSON.parse(localStorage.getItem('stationsComplete')) || [];

    // Aktualisiert den Button ("Station abschließen"), sobald die XML-Daten via loadProject.js geladen wurden
    document.addEventListener("lehrpfadLoaded", () => {
      const btn = document.getElementById("karte-button");

      if (!btn) return;
      updateKarteButton(window.location.pathname);
    })

    // Speichert das Array mit den abgeschlossenen Stationen im LocalStorage
    function updateStationsCompleteStorage() {
      localStorage.setItem('stationsComplete', JSON.stringify(window.stationsComplete));
    }

    // Klick-Handler für den Station-abschliessen-Button unten am Bildschirmrand
    const btn = document.getElementById('karte-button');
    btn.addEventListener('click', () => {
      if (window.aktuelleStationId) {
        const stationIndex = window.aktuelleStationId - 1;
        if (!window.stationsComplete.includes(stationIndex)) {
          window.stationsComplete.push(stationIndex);
          updateStationsCompleteStorage();
        }
      }
      window.location.href = '/Startseite.html'; // Zurück zur Übersichtskarte
    });

    /**
     * 2. OPTIONALE HILFSFUNKTIONEN (Bei Bedarf behalten oder löschen)
     */

    /**
     * [OPTIONAL] Blendet eine Lösungsbox mit der ID "loesung" ein/aus.
     * Beispiel-Anwendungsfall: Aufdeckbare Text- oder Bildlösungen.
     */
    function zeigeLoesung() {
      const box = document.getElementById("loesung");
      if (box.style.display === "none") {
        box.style.display = "grid";
      } else {
        box.style.display = "none";
      }
    }

    /**
     * [OPTIONAL] Logik für Single-Choice-Quizzes (MCQ).
     * Setzt im HTML voraus: 
     * - Container mit Klasse `.mcq`
     * - Antwort-Buttons mit Klasse `.mcq-option` und Attribut `data-correct="true|false"`
     * - Feedback-Feld mit Klasse `.mcq-feedback`
     * 
     * Die Benennung ".mcq" ist ein altes Fragement aus verworfenen Multiple-choice Funktionen
     */
    document.addEventListener("DOMContentLoaded", () => {
      const quizzes = document.querySelectorAll(".mcq");

      quizzes.forEach(quiz => {
        const options = Array.from(quiz.querySelectorAll(".mcq-option"));
        const feedback = quiz.querySelector(".mcq-feedback");

        const correctText = quiz.dataset.correctText || "Richtig!";
        const wrongText = quiz.dataset.wrongText || "Falsch.";

        options.forEach(btn => {
          btn.addEventListener("click", () => {
            if (!feedback.hidden) return;

            // Alle Antwortoptionen deaktivieren -> kein Llicken mehr nach Zeigen der Lösung
            options.forEach(b => b.disabled = true);

            const isCorrect = btn.dataset.correct === "true";

            btn.classList.add(isCorrect ? "correct" : "wrong");

            // Wenn falsch geantwortet wurde, auch die richtige Option grün hervorheben
            if (!isCorrect) {
              const rightBtn = options.find(b => b.dataset.correct === "true");
              if (rightBtn) rightBtn.classList.add("correct");
            }

            // Feedback-Text anzeigen
            feedback.hidden = false;
            feedback.classList.remove("richtig", "falsch");

            if (isCorrect) {
              feedback.classList.add("richtig");
              feedback.textContent = correctText;
            } else {
              feedback.classList.add("falsch");
              feedback.textContent = wrongText;
            }
          });
        });
      });
    });

  </script>
</body>
