      <!-- -----------------Inhalt der Station hier dazwischenschreiben---------------- -->

    </div>

  <script>
    // gespeicherten Fortschritt laden
    window.stationsComplete = JSON.parse(localStorage.getItem('stationsComplete')) || [];

    document.addEventListener("lehrpfadLoaded", () => {
      const btn = document.getElementById("karte-button");

      if (!btn) return;
      updateKarteButton(window.location.pathname);
    })

    function updateStationsCompleteStorage() {
      localStorage.setItem('stationsComplete', JSON.stringify(window.stationsComplete));
    }

    // Station abschliessen Funktion
    const btn = document.getElementById('karte-button');
    btn.addEventListener('click', () => {
      if (window.aktuelleStationId) {
        const stationIndex = window.aktuelleStationId - 1;
        if (!window.stationsComplete.includes(stationIndex)) {
          window.stationsComplete.push(stationIndex);
          updateStationsCompleteStorage();
        }
      }
      window.location.href = '/Startseite.html'; // Zurück zur Karte
    });

    // Eine Hilfsfunktion die die Auflösung, wie z.B. bei der ersten Aufgabe von Station 3 von Lehrpfad 1 
    // (Einfluss des Menschen auf Ökosysteme - Nutzpflanzenterasse) anzeigt. 
    // Diese Hilfsfunktion ist optional und kann, wenn nicht genutzt auch weggelassen werden.
    function zeigeLoesung() {
      const box = document.getElementById("loesung");
      if (box.style.display === "none") {
        box.style.display = "grid";
      } else {
        box.style.display = "none";
      }
    }

    //Diese Funktion regelt das Anzeigen der richtigen Lösungen in Grün oder falscher Lösungen in Rot 
    // bei Single-Choice-Quizformaten wie z.B. der Aufgabe nach dem Video von Station 3 auf Lehrpfad 1 
    // (Einfluss des Menschen auf Ökosysteme - Nutzpflanzenterasse) oder der ersten Aufgabe von Station 5 desselben Lehrpfades. 
    // Diese Hilfsfunktion ist optional und kann, wenn nicht genutzt auch weggelassen werden.
    document.addEventListener("DOMContentLoaded", () => {
      const quizzes = document.querySelectorAll(".mcq");

      quizzes.forEach(quiz => {
        const options = Array.from(quiz.querySelectorAll(".mcq-option"));
        const feedback = quiz.querySelector(".mcq-feedback");

        const correctText = quiz.dataset.correctText || "Richtig!";
        const wrongText = quiz.dataset.wrongText || "Falsch.";

        options.forEach(btn => {
          btn.addEventListener("click", () => {
            if (!feedback.hidden) return;

            options.forEach(b => b.disabled = true);

            const isCorrect = btn.dataset.correct === "true";

            btn.classList.add(isCorrect ? "correct" : "wrong");

            if (!isCorrect) {
              const rightBtn = options.find(b => b.dataset.correct === "true");
              if (rightBtn) rightBtn.classList.add("correct");
            }

            feedback.hidden = false;
            feedback.classList.remove("richtig", "falsch");

            if (isCorrect) {
              feedback.classList.add("richtig");
              feedback.textContent = correctText;
            } else {
              feedback.classList.add("falsch");
              feedback.textContent = wrongText;
            }
          });
        });
      });
    });

  </script>
</body>

</html>
